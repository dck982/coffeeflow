# Source unique de la table de codes LOG (docs/firmware.md, message 0x30).
#
# Générée vers :
#   - firmware/common/generated/log_codes.hpp   (C++, consommé par sensors/ et screen/)
#   - firmware/common/generated/log_codes.py    (Python, consommé par l'outil Mac, phase 1)
#
# Ne jamais éditer les fichiers générés à la main : lancer
# `python3 firmware/common/codegen/gen_log_codes.py`.
#
# severity : debug | info | warn | error

- name: BOOT
  severity: info
  comment: Démarrage de l'image.
- name: READY
  severity: info
  comment: Initialisation terminée, prêt à répondre au bus.
- name: REBOOT_REQUESTED
  severity: info
  comment: RESET reçu ou demandé localement.
- name: LEASE_EXPIRED
  severity: warn
  comment: Bail SET expiré, actionneurs remis à zéro.
- name: PRESENCE_LOST
  severity: warn
  comment: Plus de PING/PONG du pair depuis ~3 s, repli sécurité.
- name: PRESENCE_RESTORED
  severity: info
  comment: PING/PONG du pair de nouveau reçu après une perte de présence.
- name: RUNTIME_LOCKOUT_TRIGGERED
  severity: error
  comment: Plafond 60 s dépassé, verrou posé jusqu'à coupure secteur. arg32 = ms d'activation.
- name: COMMAND_REFUSED_LOCKED
  severity: warn
  comment: SET reçu alors que le verrou 60 s est actif.
- name: I2C_ERROR
  severity: error
  comment: Échec de transaction I2C. arg16 = adresse.
- name: DIMMER_CALIBRATING
  severity: warn
  comment: Dimmer sans secteur, en Calibrating, écriture refusée.
- name: DIMMER_ERROR
  severity: error
  comment: Registre erreur 0x02 du dimmer non nul. arg16 = valeur du registre.
- name: DIMMER_MAINS_LOST
  severity: warn
  comment: Registre 0x20 (fréquence secteur) non plausible (hors 45-65 Hz), dimmer probablement sans 230V. arg16 = valeur lue.
- name: DIMMER_MAINS_FREQ
  severity: debug
  comment: Lecture périodique du registre 0x20 (fréquence secteur), quelle que soit sa plausibilité. arg16 = valeur brute lue.
- name: XDB401_TIMEOUT
  severity: error
  comment: Pas de réponse du XDB401 après le délai de conversion.
- name: FLOWMETER_SILENT
  severity: warn
  comment: Aucune impulsion débitmètre alors qu'un débit est attendu.
- name: TWAI_ERROR_COUNTERS
  severity: debug
  comment: Compteurs d'erreur TWAI périodiques. arg16 = rx_error_counter (8 bits haut) | tx_error_counter (8 bits bas), arg32 = bus_error_count.
- name: FLASH_BEGIN
  severity: info
  comment: Début d'un flash, arg32 = taille annoncée.
- name: FLASH_PROGRESS
  severity: debug
  comment: Progression d'un flash. arg32 = octets écrits.
- name: FLASH_DONE
  severity: info
  comment: Flash terminé, CRC32 global vérifié.
- name: FLASH_FAILED
  severity: error
  comment: Flash abandonné ou CRC invalide.
- name: OTA_PENDING_VERIFY
  severity: info
  comment: Nouvelle image démarrée, en attente de validation par ping/pong CAN.
- name: OTA_VALIDATED
  severity: info
  comment: Nouvelle image validée, devient l'image courante.
- name: OTA_ROLLBACK
  severity: error
  comment: Validation échouée, retour à l'image précédente.
- name: LCD_INIT_STEP
  severity: debug
  comment: Bisection du bring-up esp_lcd/GT911/lvgl_port (lot 2). arg16 = étape.
- name: WIFI_CONNECTED
  severity: info
  comment: Association Wi-Fi et adresse IP obtenues.
- name: WIFI_DISCONNECTED
  severity: warn
  comment: Station Wi-Fi déconnectée ; pas de repli AP automatique si les credentials existent.
- name: WIFI_AP_STARTED
  severity: info
  comment: Point d'accès de provisioning démarré car aucun credential n'est enregistré.
- name: NETWORK_FORGOTTEN
  severity: info
  comment: Credentials Wi-Fi effacés explicitement ; retour AP.
- name: HTTP_AUTH_REFUSED
  severity: warn
  comment: Requête HTTP refusée pour authentification manquante ou invalide.
- name: CONFIG_REJECTED
  severity: warn
  comment: POST /config rejeté. arg16 identifie la clé fautive.
- name: BLE_SCAN_STARTED
  severity: debug
  comment: Client BLE Acaia prêt et scan actif.
- name: BLE_SCALE_FOUND
  severity: info
  comment: Annonce BLE Acaia reconnue, connexion demandée. arg16 = RSSI signé sur 16 bits.
- name: BLE_CONNECTED
  severity: info
  comment: Connexion GATT Acaia établie.
- name: BLE_SUBSCRIBED
  severity: info
  comment: Notifications Acaia activées ; heartbeat démarré.
- name: BLE_DISCONNECTED
  severity: warn
  comment: Connexion BLE Acaia perdue ou arrêtée.
- name: BLE_ERROR
  severity: warn
  comment: Échec client BLE Acaia. arg16 = code NimBLE ou ESP-IDF.
- name: BREW_STARTED
  severity: info
  comment: Cycle d'infusion démarré.
- name: BREW_STOPPED
  severity: info
  comment: Cycle d'infusion arrêté. arg16 = motif d'arrêt.
- name: PURGE_STARTED
  severity: info
  comment: Purge homme-mort démarrée.
- name: PURGE_STOPPED
  severity: info
  comment: Purge arrêtée. arg16 = relâchement ou plafond.
