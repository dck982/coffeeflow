# Workspace hôte (toolchain `stable`, tests sur le Mac). Les crates xtensa
# (`screen`, `sensors`) et les essais sont autonomes : chacun a sa toolchain
# `esp`, son `.cargo/config.toml` et son `Cargo.lock`, donc hors workspace.
# `sensors-logic` est la logique du module capteurs, que `sensors` (xtensa)
# enveloppe. `screen-core` s'ajoute ici quand il existe.
[workspace]
resolver = "3"
members = ["protocol", "coffeetool", "sensors-logic", "screen-core"]
exclude = ["trials", "screen", "sensors"]
