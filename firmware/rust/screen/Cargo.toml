[package]
edition      = "2024"
name         = "screen"
rust-version = "1.95"
version      = "0.4.2"

[dependencies]
screen-core = { path = "../screen-core" }
bt-hci = "0.9.0"
trouble-host = { version = "0.7.0", features = ["scan"] }
heapless = "0.9.1"
esp-radio = { version = "1.0.0-beta.1", features = ["ble", "coex", "esp-alloc", "esp32s3", "log-04", "unstable", "wifi"] }
protocol = { path = "../protocol", default-features = false }
embassy-futures = "0.1"
esp-storage = { version = "0.10.0", default-features = false, features = ["esp32s3", "embedded-storage"] }
embedded-storage = "0.3"
esp-nvs = "0.6.2"
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
embassy-sync = "0.8"
embassy-embedded-hal = "0.6.0"
embedded-hal-async = "1.0.0"
# Sans l'allocateur global d'esp-alloc : heap.rs pose le sien, qui choisit
# la mémoire selon le cœur. `compat` fournit malloc aux blobs radio, qui
# viendront avec le réseau et le BLE.
esp-alloc = { version = "0.11.0", default-features = false, features = [
  "compat",
  "esp32s3",
  "internal-heap-stats",
] }
# `custom-halt` : après une panique, `custom_halt` (main.rs) redémarre, au
# lieu de la boucle infinie par défaut.
esp-backtrace = { version = "0.20.0", features = [
  "custom-halt",
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32s3",
  "log-04",
  "uart",
] }
esp32s3 = "0.36.0"
slint = { version = "=1.18.1", default-features = false, features = [
  "compat-1-2",
  "libm",
  "renderer-software",
  "unsafe-single-threaded",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

screen-net = { path = "../screen-net" }
esp-wifi-sys-esp32s3 = "0.3"
embedded-io-async = "0.7"
embassy-net = { version = "0.9", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "tcp", "udp", "dns"] }
edge-dhcp = "0.8"
edge-nal = "0.7"
edge-nal-embassy = "0.9"

[build-dependencies]
slint-build = "=1.18.1"

[profile.dev]
# Le profil de débogage par défaut est trop lent et trop gros pour la carte.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'

# esp-nvs 0.6.2 corrigé localement : l'ouverture lisait ses pages sur la pile
# (trame de 12,5 Ko), trop pour la pile du cœur radio. Voir l'en-tête du
# correctif dans `vendor/esp-nvs/src/init.rs`.
# esp-hal 1.2.2 corrigé localement : `time::now` rendu monotone entre les deux
# cœurs (lecture du compteur sous verrou), voir `vendor/esp-hal/src/time.rs`.
# esp-rtos 0.4.0 instrumenté : piles des tâches créées par les blobs radio
# peintes et mesurées, agrandies de `RADIO_EXTRA_TASK_STACK` octets au build,
# voir `vendor/esp-rtos/src/radio_stacks.rs`.
[patch.crates-io]
esp-nvs = { path = "../vendor/esp-nvs" }
esp-hal = { path = "../vendor/esp-hal" }
esp-rtos = { path = "../vendor/esp-rtos" }
