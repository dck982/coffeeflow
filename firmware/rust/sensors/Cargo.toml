[package]
edition      = "2024"
name         = "sensors"
rust-version = "1.95"
version      = "0.4.10"

[features]
default = []
# Première installation : l'image ignore CONFIRM_SENSORS_OTA et redémarre au
# bout de 30 s, donc le bootloader ramène toujours l'image précédente. On ne
# construit la version qui se valide qu'une fois vue sa réception d'une OTA.
no-validate = []

[dependencies]
protocol      = { path = "../protocol" }
sensors-logic = { path = "../sensors-logic" }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
# Sa section critique (interruptions masquées pendant chaque opération) reste :
# le code de ce module s'exécute depuis la flash, sans affichage ni PSRAM.
esp-storage = { version = "0.10.0", default-features = false, features = [
  "critical-section",
  "esp32s3",
] }
log = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
embassy-sync     = "0.8"
embassy-futures  = "0.1"
# `custom-halt` : après une panique, `custom_halt` (main.rs) redémarre, au
# lieu de la boucle infinie par défaut.
esp-backtrace = { version = "0.20.0", features = [
  "custom-halt",
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32s3",
  "log-04",
  "uart",
] }
sha2 = { version = "0.11", default-features = false }

critical-section = "1.2.0"
static_cell      = "2.1.1"

[profile.dev]
# Le profil de débogage par défaut est trop lent et trop gros pour la carte.
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
