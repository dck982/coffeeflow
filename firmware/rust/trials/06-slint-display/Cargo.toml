[package]
edition      = "2024"
name         = "trial-06-slint-display"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "trial-06-slint-display"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-alloc = { version = "0.11.0", features = ["esp32s3", "internal-heap-stats"] }
esp-backtrace = { version = "0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32s3",
  "log-04",
  "uart",
] }
esp32s3 = "0.36.0"
slint = { version = "=1.18.1", default-features = false, features = [
  "compat-1-2",
  "libm",
  "renderer-software",
  "unsafe-single-threaded",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

[build-dependencies]
slint-build = "=1.18.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'

[features]
# Par défaut, Slint dessine directement dans le framebuffer affiché
# (ReusedBuffer). Avec cette feature, il dessine dans un second framebuffer,
# échangé avec le premier au début d'une trame (SwappedBuffers).
swapped-buffers = []
# Slint compose chaque ligne en SRAM interne, recopiée ensuite dans le
# framebuffer affiché. Exclusive de swapped-buffers.
line-by-line = []
# Fréquence de mise à jour réduite et décalée par groupe de valeurs
# (demo::REDUCED_RATES), au lieu de 10 Hz pour toutes. Combinable avec les
# deux précédentes.
reduced-rate = []
exec-from-flash = [] # code et rodata lus en flash, sans XIP
