[package]
edition      = "2024"
name         = "trial-08c-nvs"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name = "trial-08c-nvs"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"] }
esp-rtos = { version = "0.4.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
# Le code s'exécute depuis la flash : esp-storage garde sa section critique.
esp-storage = { version = "0.10.0", features = ["embedded-storage", "esp32s3"] }
# Sans feature de puce : elle tire esp-storage < 0.10. Le CRC et l'accès à
# la flash viennent de `flash.rs`.
esp-nvs          = "0.6.2"
embedded-storage = "0.3.1"
log              = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
embassy-net      = { version = "0.9.0", features = [
  "dhcpv4",
  "medium-ethernet",
  "proto-ipv4",
  "tcp",
] }
embedded-io-async = "0.7"
esp-alloc = { version = "0.11.0", features = ["esp32s3"] }
# `custom-halt` : après une panique, `custom_halt` redémarre (essai 08b).
esp-backtrace = { version = "0.20.0", features = [
  "custom-halt",
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.18.0", default-features = false, features = [
  "colors",
  "critical-section",
  "esp32s3",
  "log-04",
  "uart",
] }
esp-radio = { version = "1.0.0-beta.1", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
critical-section = "1.2.0"
heapless         = "0.9.1"
static_cell      = "2.1.1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'

[features]
# Un cas par build.
# Zone factice dans le slot démarré : relire l'image d'IDF, puis écrire,
# modifier, effacer.
c-factice = []
# Vrai NVS en lecture seule : noms, types et longueurs, puis le Wi-Fi de la
# maison avec les identifiants de coffeeflow.
c-reel-lecture = []
# Vrai NVS : une clé de test écrite et relue.
c-reel-ecriture = []
