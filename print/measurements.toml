# coffeeflow / print — hardware the printed parts have to fit.
#
# Project: electronics on a Profitec Go espresso machine (ESP32-S3 / M5Stack
# Atom S3 Voice). This tree is only the FDM parts. Firmware stays at the
# coffeeflow repo root (sound_test/, tts/). Later prints: sensor box, screen box.
#
# Printer: Bambu Lab A1 Mini, 0.4 mm nozzle.
# Filament: Bambu Lab PETG HF Black, SKU 33102.
# Fasteners: M3 throughout. boitier_2w uses a captive ISO hex nut from the
# bed; boitier_4w still has a 2.6 mm printed pilot for a plain M3×10 until
# the bosses grow. Do not switch to M4.
# Wires: Helukabel Helutherm 145, 0.75 mm², outer diameter 2.2 mm.
# Mount: two 8 x 3 mm disc magnets, no drilling the chassis. The face the box
# sits on runs about 40-50 °C, so Wagos stand on 2 mm rails and must not touch
# the floor. A 3 mm lip in the magnet channel stops them sliding out of the bays.
# Bambu Studio: prefer 3MF from `nurb export` (printer.toml). Spec 1.41 may
# warn in Studio; the object still imports. STL via `--formats stl` if needed.

[wago_largeur]
value = 18.7
unit = "mm"
how = "user: Wago 221-423 across the three levers. Datasheet 221-423 is 18.8 mm width."

[wago_profondeur]
