[passe_cable_filet_pas]
value = 2.0
unit = "mm"
how = "Chosen, not measured: the cable gland found online measures 1.41 mm crest to crest but a 1.41 pitch has no room left for a crest — 35° flank 0.71 + 45° return flank 0.65 = 1.36 of 1.41, so the crest flat is 0.12 mm, under one 0.42 mm bead (nurb min_wall). 2.0 mm buys a 0.64 mm crest with both flanks still at the printable limit. Male and female are both printed here, so the pair is self-consistent; a bought gland nut will NOT mate. User's call, 2026-08-22. Record only: the live value is the `pas_filet` slider on passe_cable and ecrou_passe_cable — keep the two in step."

[passe_cable_filet_profondeur]
value = 0.5
unit = "mm"
how = "Sawtooth depth. A section through the online gland showed ~0.65–0.78 mm; 0.5 mm with a 35° axial underside lands under 45° after helix/Frenet (a pure 45° axial V reads ~51° and fails nurb check). Record only: the live value is the `profondeur_filet` slider on both parts."

[passe_cable_filet_jeu]
value = 0.3
unit = "mm"
how = "nurb fits table, moving: extra on diameter between the printed male and female threads. Record only: the live value is the `jeu_filet` slider on ecrou_passe_cable."

[passe_cable_amorce]
value = 1.5
unit = "mm"
how = "Male thread past the seated nut (about three quarters of a turn of runout). Male thread height = nut 5.0 + this 1.5 = 6.5 mm = 3.25 turns at pitch 2.0; smooth collar below = tole 1.0 + floor 1.6."

